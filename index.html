<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    
</head>

<body>

    <div id="menu">
        <h1>RESIDENT ARRAY</h1>
        <button id="start" onclick="startGame()">Start</button>
        <button id="controls">Controls</button>
        <div id="controlsOverlay" class="overlay">
            <div class="overlay-content">
                <h2>Controls</h2>
                <ul>
                    <li><strong>WSAD - Movement</strong> </li>
                    <li><strong>Space - Slash</strong> </li>
                    <li><strong>Enter - Confirm</strong> </li>

                </ul>
                <button id="closeControls">Back to Menu</button>
            </div>
        </div>
    </div>

    <div id="deathScreen">

        <h1 id="deathText">
            YOU ARE DEAD
        </h1>

        <button id="restartBtn">
            RETRY?
        </button>
    </div>
    <div id="winScreen">
        <h1 id="winText">YOU HAVE FLED THE DUNGEON</h1>
        <button id="winRestartBtn">PLAY AGAIN</button>
    </div>
    

    <canvas id="game"></canvas>
    <script src="script.js"></script>


</body>


</html>
