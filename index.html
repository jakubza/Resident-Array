<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resident Array</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="crt-screen"></div>
    <div id="fadeOverlay"></div>

    <div id="menu">
        <h1 class="title">RESIDENT ARRAY</h1>

        <div class="subtitle">a survival pixel dungeon crawler</div>

        <button id="start">START</button>
        <button id="controls">CONTROLS</button>

        <div class="hint">PRESS START TO BEGIN</div>

        <div id="controlsOverlay" class="overlay">
            <div class="overlay-content">
                <h2>Controls</h2>
                <ul>
                    <li>WSAD - Movement</li>
                    <li>Space - Slash</li>
                    <li>Enter - Confirm</li>
                </ul>
                <button id="closeControls">Back to Menu</button>
            </div>
        </div>
    </div>

    <div id="deathScreen">
        <h1 id="deathText">YOU ARE DEAD</h1>
        <button id="restartBtn">RETRY?</button>
    </div>

    <div id="winScreen">
        <h1 id="winText">YOU HAVE FLED THE DUNGEON</h1>
        <button id="winRestartBtn">PLAY AGAIN</button>
    </div>

    <canvas id="game"></canvas>

    <script type="module" src="main.js"></script>
</body>

</html>
